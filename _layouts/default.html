<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>{% if page.title %}{{ page.title }} | {% endif %}{{ site.title }}</title>
    <meta name="description" content="{{ page.description | default: site.description }}" />
    <style>
      :root {
        --bg: #fcfcf9;
        --card: #ffffff;
        --text: #171717;
        --muted: #666;
        --line: #e8e8e3;
        --accent: #0f766e;
      }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        background: var(--bg);
        color: var(--text);
        line-height: 1.7;
      }
      .wrap { max-width: 860px; margin: 0 auto; padding: 24px; }
      .shell {
        background: var(--card);
        border: 1px solid var(--line);
        border-radius: 20px;
        padding: 28px;
        box-shadow: 0 6px 24px rgba(0,0,0,.04);
      }
      header.site {
        display: flex;
        justify-content: space-between;
        align-items: center;
        gap: 12px;
        margin-bottom: 24px;
      }
      a { color: var(--accent); text-decoration: none; }
      a:hover { text-decoration: underline; }
      .brand { font-weight: 700; color: var(--text); }
      .muted { color: var(--muted); }
      h1,h2,h3 { line-height: 1.2; }
      h1 { font-size: clamp(2rem, 4vw, 3rem); margin: 0 0 12px; }
      h2 { margin-top: 2rem; font-size: 1.5rem; }
      h3 { margin-top: 1.25rem; font-size: 1.15rem; }
      p, li { font-size: 1.05rem; }
      ul, ol { padding-left: 1.3rem; }
      code {
        font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
        background: #f5f5f0;
        border: 1px solid #ececdf;
        border-radius: 6px;
        padding: .1rem .35rem;
        font-size: .95em;
      }
      pre {
        overflow-x: auto;
        background: #f5f5f0;
        border: 1px solid #ececdf;
        border-radius: 12px;
        padding: 14px;
      }
      .story-list { display: grid; gap: 16px; }
      .story-card {
        display: block;
        border: 1px solid var(--line);
        border-radius: 16px;
        padding: 18px 18px 16px;
        background: #fff;
      }
      .story-card:hover { border-color: #d8d8d0; text-decoration: none; }
      .eyebrow { font-size: .85rem; text-transform: uppercase; letter-spacing: .08em; color: var(--muted); }
      .footer-note { margin-top: 32px; font-size: .95rem; color: var(--muted); }
    </style>
  </head>
  <body>
    <div class="wrap">
      <header class="site">
        <a class="brand" href="{{ site.baseurl }}/">{{ site.title }}</a>
        <a href="https://github.com/qaz6209031/openclaw-career-copilot-story">GitHub</a>
      </header>
      <main class="shell">
        {{ content }}
      </main>
    </div>
  </body>
</html>
